# ============================================================
# Sri Lanka Luxury Bus Timetable — Application Properties
# ============================================================
# These settings are used for LOCAL DEVELOPMENT.
# Production values on Render.com are set via Environment Variables
# (see the Render deployment guide).
# ============================================================

spring.application.name=bus-timetable-api

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL DataSource ────────────────────────────────────
# For local dev: replace with your local PostgreSQL credentials.
# For Render.com: these are overridden by DATABASE_URL env var.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-sparkling-sky-aq32s7np-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_lGaKisqtoO84}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
# 'update'  → Hibernate auto-creates/alters tables to match entities.
#            Safe for development. Use 'validate' or 'none' in production
#            once schema is stable.
spring.jpa.hibernate.ddl-auto=update

# Dialect — Spring Boot 3 auto-detects this, but explicit is safer
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Print SQL to console (disable in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Connection Pool (HikariCP defaults) ─────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ── Logging ─────────────────────────────────────────────────
logging.level.com.busTimetable=DEBUG
logging.level.org.springframework.web=INFO
